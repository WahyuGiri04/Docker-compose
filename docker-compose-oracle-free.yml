services:
  oracle-db-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-db-free
    ports:
      - "1521:1521" # Host port 1522, container port 1521
      - "5500:5500"
    environment:
      DB_SID: ORCL
      ORACLE_PWD: sapassword
      DB_PDB: ORAGIRIPDB
      DB_DOMAIN: oracledb.giri.local
      ENABLE_ARCHIVELOG: "true"
    volumes:
      - oracle-data-free:/opt/oracle/oradata
      - oracle-backup-free:/opt/oracle/backup
    restart: unless-stopped

volumes:
  oracle-data-free:
    driver: local
  oracle-backup-free:
    driver: local